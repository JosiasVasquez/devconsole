[Launch]
ProgramExecutable=AppInfo\Scripts\PowerShell.cmd

[Environment]
PATH=%PAL:AppDir%\Antigravity;%PAL:AppDir%\uv;%PAL:AppDir%\NodeJS;%PAL:AppDir%\Git\bin;%PAL:AppDir%\Git\usr\bin;%PATH%
UV_CACHE_DIR=%PAL:DataDir%\uv-cache
npm_config_prefix=%PAL:DataDir%\npm
npm_config_cache=%PAL:DataDir%\npm-cache

[FileWrite1]
Type=ConfigWrite
File=%PAL:DataDir%\settings.ini
Entry=LastDrive
Value=%PAL:Drive%

[FileWrite2]
Type=Replace
File=%PAL:DataDir%\home\.gitconfig
Find=%PAL:LastDrive:ForwardSlash%%PAL:LastPackagePartialDir:ForwardSlash%
Replace=%PAL:Drive:ForwardSlash%%PAL:PackagePartialDir:ForwardSlash%