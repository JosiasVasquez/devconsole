[Launch]
ProgramExecutable=AppInfo\Scripts\cmd.cmd
Name=CMD - Dev Console

[Environment]
PATH=%PAL:DataDir%\npm;%PAL:AppDir%\uv;%PAL:AppDir%\NodeJS;%PAL:AppDir%\Git\cmd;%PAL:AppDir%\Git\bin;%PAL:AppDir%\Git\usr\bin;%PAL:AppDir%\PHP;%PAL:AppDir%\Antigravity;%PAL:AppDir%\..\..\CommonFiles\uv;%PAL:AppDir%\..\..\CommonFiles\NodeJS;%PAL:AppDir%\..\..\CommonFiles\Git\cmd;%PAL:AppDir%\..\..\CommonFiles\Git\bin;%PAL:AppDir%\..\..\CommonFiles\Git\usr\bin;%PAL:AppDir%\..\..\CommonFiles\PHP;%PAL:AppDir%\..\..\CommonFiles\Antigravity;%PATH%
UV_CACHE_DIR=%PAL:DataDir%\uv-cache
npm_config_prefix=%PAL:DataDir%\npm
npm_config_cache=%PAL:DataDir%\npm-cache
HOME=%PAL:DataDir%\home

[FileWrite1]
Type=ConfigWrite
File=%PAL:DataDir%\settings.ini
Entry=LastDrive
Value=%PAL:Drive%

[FileWrite2]
Type=Replace
File=%PAL:DataDir%\home\.gitconfig
Find=%PAL:LastDrive:ForwardSlash%%PAL:LastPackagePartialDir:ForwardSlash%
Replace=%PAL:Drive:ForwardSlash%%PAL:PackagePartialDir:ForwardSlash%